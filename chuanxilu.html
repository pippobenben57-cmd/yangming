<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="《传习录》全本三卷三百四十二条：原文、白话、简注、维基文库校注，以及导读、核心概念、名段、名句和读法。">
<title>传习录 · 王阳明 — 渊默的学习小院</title>
<style>
:root{
  --bg:#dfe8e4;--panel:#f4f7f4;--land:#eef3ef;--ink:#1c2a2b;--soft:#56686a;--faint:#869593;--line:#a9bcb8;
  --seal:#b3271f;--seal-soft:#f1dcd6;
  --display:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10181a;--panel:#172124;--land:#1b272a;--ink:#dfe8e4;--soft:#8fa3a3;--faint:#647676;--line:#35474a;--seal:#e2584a;--seal-soft:#3a1f1b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10181a;--panel:#172124;--land:#1b272a;--ink:#dfe8e4;--soft:#8fa3a3;--faint:#647676;--line:#35474a;--seal:#e2584a;--seal-soft:#3a1f1b;color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.9;padding:24px 18px 64px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--seal)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto}
.home{font-size:.84rem;color:var(--soft);text-decoration:none;letter-spacing:.06em;margin-right:16px}
.home:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;margin:12px 0 14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.1;margin:0;letter-spacing:.08em}
.sub{margin:0;color:var(--soft);font-size:.95rem;flex:1 1 260px}
.find{flex:0 1 300px;min-width:0}
input[type=search]{font:inherit;font-size:.92rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 12px;width:100%;border-radius:0}
.qres{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin-bottom:14px;max-height:340px;overflow-y:auto}
.qres p{margin:0 0 4px;font-size:.82rem;color:var(--soft)}
.qres button{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;width:100%;padding:3px 0;font-size:.92rem;line-height:1.6}
.qres button:hover .rt{text-decoration:underline}
.qres .rs{color:var(--seal);font-variant-numeric:tabular-nums}
mark{background:var(--seal-soft);color:inherit}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:2px 20px;padding:8px 0;border-top:3px double var(--ink);border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs a{font-family:var(--kai);font-size:1.08rem;color:var(--soft);text-decoration:none;border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--seal);border-bottom-color:var(--seal)}
@media (max-width:760px){nav.tabs{position:static}}

.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:40px;align-items:start}
.side{position:sticky;top:58px;max-height:calc(100vh - 70px);overflow-y:auto}
.side h4{font-family:var(--kai);font-weight:400;font-size:.9rem;color:var(--faint);margin:10px 0 2px;letter-spacing:.2em}
.side ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.side button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;padding:1px 0 1px 12px;margin-left:-1px;border-left:2px solid transparent;font-family:var(--kai);font-size:1rem;line-height:1.75}
.side button small{font-family:var(--body);font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
.side button:hover{color:var(--seal)}
.side button[aria-current="true"]{border-left-color:var(--seal);color:var(--seal)}
.opts{margin-top:14px;font-size:.84rem;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{position:static;max-height:none}
  .side ol{border-left:0;display:flex;flex-wrap:wrap;gap:2px 14px}
  .side button{padding:0;border-left:0;border-bottom:2px solid transparent;width:auto}
  .side button small{display:none}
  .side button[aria-current="true"]{border-bottom-color:var(--seal)}
  .opts{flex-direction:row;flex-wrap:wrap;gap:4px 18px}
}
.sec-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.sec-head .ord{font-size:.84rem;color:var(--faint);letter-spacing:.2em}
h2{font-family:var(--kai);font-weight:400;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.25;margin:0 0 6px}
.sec-head p{margin:0 0 6px;max-width:42em}
.hn{font-size:.86rem;color:var(--soft)}
article.it{display:grid;grid-template-columns:3em minmax(0,1fr);gap:0 14px;padding:20px 0 16px;border-bottom:1px solid var(--line);scroll-margin-top:60px}
article.it.hit{background:linear-gradient(90deg,var(--seal-soft),transparent 70%)}
.it .no{font-size:.86rem;color:var(--seal);font-variant-numeric:tabular-nums;padding-top:.45em}
.it .t{font-family:var(--kai);font-size:1.22rem;line-height:1.9;margin:0 0 8px;max-width:36em}
.it .t p,.it .b p{margin:0 0 6px}
.it sup{font-family:var(--body);font-size:.62em;color:var(--seal);margin:0 1px}
.it .b{margin:0 0 6px;max-width:40em}
.it .jd{margin:10px 0 6px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);max-width:44em;font-size:.95rem}
.it .jd h5{margin:0 0 2px;font-family:var(--kai);font-weight:400;font-size:1rem;color:var(--seal);letter-spacing:.1em}
.it .jd p{margin:0 0 8px}
.it .jd p:last-child{margin-bottom:0}
.nojd .it .jd{display:none}
.it .n{margin:6px 0;font-size:.9rem;color:var(--soft);max-width:44em;border-left:2px solid var(--line);padding-left:10px}
.it details{margin-top:4px;max-width:46em}
.it summary{cursor:pointer;font-size:.84rem;color:var(--faint);list-style:none;display:inline-block}
.it summary::-webkit-details-marker{display:none}
.it summary::before{content:"＋ "}
.it details[open] summary::before{content:"－ "}
.it summary:hover{color:var(--seal)}
.it ol.notes{font-size:.88rem;color:var(--soft);margin:6px 0 0;padding-left:1.6em;white-space:pre-line}
.pre{padding:18px 0;border-bottom:1px solid var(--line)}
.pre .t{font-family:var(--kai);font-size:1.15rem;white-space:pre-line;margin:0 0 10px;max-width:38em}
.pre .b{white-space:pre-line;max-width:40em;margin:0}
.veil .it .b,.veil .it .n,.veil .it .jd,.veil .pre .b{filter:blur(6px);cursor:pointer;user-select:none}
.veil .it.show .b,.veil .it.show .n,.veil .it.show .jd,.veil .pre.show .b{filter:none;cursor:auto;user-select:auto}
@media (max-width:560px){article.it{grid-template-columns:minmax(0,1fr)}.it .no{padding-top:0}.it .t{font-size:1.14rem}}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:22px;font-family:var(--kai);font-size:1.05rem}
.pager button:hover{color:var(--seal)}

.page{max-width:880px}
.lede{max-width:42em}
.fine{font-size:.86rem;color:var(--soft);border-left:2px solid var(--seal);padding-left:10px;max-width:46em}
h3{font-family:var(--kai);font-weight:400;font-size:1.35rem;margin:30px 0 8px;color:var(--seal)}
.card{padding:16px 0;border-top:1px solid var(--line)}
.card h3{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;color:var(--ink);font-size:1.45rem}
.card h3 small{font-family:var(--body);font-size:.84rem;color:var(--seal)}
.card p{margin:4px 0 8px;max-width:42em}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font-size:.8rem;border:1px solid var(--line);background:var(--panel);padding:0 8px;color:var(--seal);font-variant-numeric:tabular-nums}
.ref:hover{border-color:var(--seal)}
.jump{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 6px;font-family:var(--kai);font-size:1.05rem}
.jump a{color:var(--soft);text-decoration:none}
.jump a:hover{color:var(--seal)}
.slist{list-style:none;margin:0;padding:0}
.slist li{border-top:1px solid var(--line)}
.slist button{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:0 12px;width:100%;padding:10px 0}
.slist .rs{color:var(--seal);font-variant-numeric:tabular-nums;padding-top:3px;font-size:.86rem}
.slist b{font-family:var(--kai);font-weight:400;font-size:1.15rem;display:block}
.slist span.o{font-size:.92rem;color:var(--soft)}
.slist button:hover b{color:var(--seal)}
.say li button{grid-template-columns:minmax(0,1fr) 3.2em}
.say li .q{font-family:var(--kai);font-size:1.1rem;line-height:1.6}
.say li .rs{text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td{vertical-align:top;padding:8px 10px 8px 0;border-top:1px solid var(--line)}
.tbl td:first-child{white-space:nowrap;color:var(--faint);font-size:.82rem}
.tbl td.nm{font-family:var(--kai);font-size:1.05rem;white-space:nowrap}
.tbl td.rg{white-space:nowrap;color:var(--seal);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
footer{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--faint);max-width:60em}
</style>
</head>
<body>
<div class="wrap">
<a class="home" href="../">← 渊默的学习小院</a><a class="home" href="./">← 王阳明行迹图</a>
<header>
  <h1>传习录</h1>
  <p class="sub">三卷，三百四十二条。每条有原文、白话、解读、历史上的例子和校注；另有导读、核心概念、名段和名句。</p>
  <div class="find"><input id="q" type="search" placeholder="搜原文或白话，或直接输条号 275" aria-label="搜索传习录"></div>
</header>
<div id="qres" class="qres" hidden></div>
<nav class="tabs" id="tabs" aria-label="栏目">
  <a href="#/r/0" data-t="r">逐条读</a>
  <a href="#/guide" data-t="guide">导读</a>
  <a href="#/ideas" data-t="ideas">核心概念</a>
  <a href="#/stories" data-t="stories">名段</a>
  <a href="#/sayings" data-t="sayings">名句</a>
  <a href="#/how" data-t="how">怎么读</a>
</nav>
<main id="main"><p>正在取书……</p></main>
<footer>原文与条下校注取自维基文库《傳習錄》（原文公有领域，校注依 CC BY-SA 4.0），繁体转为简体。白话、解读、历史例子和各栏说明由 AI（Claude）撰写，未经专业学者校订，引用请核对纸质版本。详见“怎么读”末节。</footer>
</div>
<script src="cxl/cb1.js"></script><script src="cxl/cb2.js"></script><script src="cxl/cb3.js"></script><script src="cxl/cb4.js"></script><script src="cxl/cb5.js"></script>
<script src="cxl/cb6.js"></script><script src="cxl/cb7.js"></script><script src="cxl/cb8.js"></script><script src="cxl/cb9.js"></script><script src="cxl/cb10.js"></script>
<script src="cxl/cj1.js"></script><script src="cxl/cj2.js"></script><script src="cxl/cj3.js"></script><script src="cxl/cj4.js"></script><script src="cxl/cj5.js"></script><script src="cxl/cj6.js"></script>
<script src="cxl/guide.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),main=$("#main"),qres=$("#qres"),q=$("#q");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras=s=>String(s).split("\n").filter(Boolean).map(x=>`<p>${x}</p>`).join("");
const han=s=>s.replace(/[^一-鿿]/g,"");
const CB=window.CB||{},CG=window.CG||{},CJ=window.CJ||{};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let SECS=[],BYN={},IDX=[];

const label=h=>({"又":"又答陆原静书","二":"再答聂文蔚"})[h]||h.replace(/^以下门人|^门人|^此后/,"");
const range=s=>s.items.length?`${s.items[0].n}—${s.items[s.items.length-1].n}`:"";
function info(s){if(!s.items.length)return null;const n=s.items[0].n;return CG.SECTIONS.find(x=>{const [a,b]=x[2].split("—").map(Number);return n>=a&&n<=b})}
function refBtn(n){return `<button class="ref" data-go="${n}">${n}</button>`}

function item(it){
  const bh=CB[it.n]||[];
  const t=esc(it.t).replace(/〔(\d+)〕/g,"<sup>$1</sup>");
  const notes=it.notes.length?`<details><summary>校注 ${it.notes.length} 条</summary><ol class="notes">${it.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:"";
  return `<article class="it" id="n${it.n}"><div class="no">${it.n}</div><div><div class="t">${paras(t)}</div>${bh[0]?`<div class="b">${paras(esc(bh[0]))}</div>`:""}${bh[1]?`<p class="n">${esc(bh[1])}</p>`:""}${CJ[it.n]?`<div class="jd"><h5>解读</h5><p>${esc(CJ[it.n][0])}</p><h5>历史上的例子</h5><p>${esc(CJ[it.n][1])}</p></div>`:""}${notes}</div></article>`;
}
function viewRead(i,n){
  i=Math.max(0,Math.min(SECS.length-1,i||0));const s=SECS[i],inf=info(s);
  store.set("cxl-sec",i);
  let side="",vol="";
  SECS.forEach((x,j)=>{if(x.v!==vol){if(vol)side+="</ol>";vol=x.v;side+=`<h4>${esc(vol)}</h4><ol>`}side+=`<li><button data-sec="${j}" aria-current="${j===i}">${esc(label(x.h))}<small>${esc(range(x))}</small></button></li>`});
  side+="</ol>";
  const pre=s.pre?`<div class="pre"><div class="t">${esc(s.pre).replace(/〔(\d+)〕/g,"<sup>$1</sup>")}</div>${CG.PRE[s.h]?`<p class="b">${esc(CG.PRE[s.h])}</p>`:""}${s.pren.length?`<details><summary>校注 ${s.pren.length} 条</summary><ol class="notes">${s.pren.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:""}</div>`:"";
  const head=`<div class="sec-head"><div class="ord">${esc(s.v)}${s.items.length?` · 第 ${esc(range(s))} 条`:""}</div><h2>${esc(label(s.h))}</h2>${inf?`<p>${esc(inf[3])}</p>`:""}${s.hn.length?`<p class="hn">${s.hn.map(esc).join("；")}</p>`:""}</div>`;
  const pv=SECS[i-1],nx=SECS[i+1];
  const pager=`<div class="pager">${pv?`<button data-sec="${i-1}">← ${esc(label(pv.h))}</button>`:"<span></span>"}${nx?`<button data-sec="${i+1}">${esc(label(nx.h))} →</button>`:"<span></span>"}</div>`;
  main.innerHTML=`<div class="layout"><aside class="side">${side}<div class="opts"><label><input type="checkbox" id="veil"${store.get("cxl-veil")==="1"?" checked":""}>先遮住白话</label><label><input type="checkbox" id="showjd"${store.get("cxl-jd")==="0"?"":" checked"}>显示解读与例子</label><label><input type="checkbox" id="opennotes">展开全部校注</label></div></aside><section id="book">${head}${pre}${s.items.map(item).join("")}${pager}</section></div>`;
  const book=$("#book"),veil=$("#veil");book.classList.toggle("veil",veil.checked);
  const sj=$("#showjd");book.classList.toggle("nojd",!sj.checked);sj.addEventListener("change",()=>{book.classList.toggle("nojd",!sj.checked);store.set("cxl-jd",sj.checked?"1":"0")});
  veil.addEventListener("change",()=>{book.classList.toggle("veil",veil.checked);store.set("cxl-veil",veil.checked?"1":"0")});
  $("#opennotes").addEventListener("change",e=>book.querySelectorAll("details").forEach(d=>d.open=e.target.checked));
  book.addEventListener("click",e=>{if(!book.classList.contains("veil"))return;const a=e.target.closest(".it,.pre");if(a&&e.target.closest(".b,.n,.jd"))a.classList.add("show")});
  if(n){const el=document.getElementById("n"+n);if(el){el.classList.add("hit","show");el.scrollIntoView({block:"start"});return}}
  window.scrollTo(0,0);
}
function viewGuide(){
  main.innerHTML=`<section class="page"><h2>导读</h2>${CG.INTRO.map(x=>`<p class="lede">${esc(x)}</p>`).join("")}
  <h3>全书结构</h3><div class="tw"><table class="tbl"><tbody>${CG.SECTIONS.map(x=>`<tr><td>${esc(x[0])}</td><td class="nm">${esc(x[1])}</td><td class="rg"><button class="ref" data-go="${x[2].split("—")[0]}">${esc(x[2])}</button></td><td>${esc(x[3])}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function viewIdeas(){
  main.innerHTML=`<section class="page"><h2>核心概念</h2><p class="lede">阳明的学问说来只是一件事，但从不同角度有不同的名称。下面每个概念后列出最相关的条目，点编号跳到原文。</p>
  <div class="jump">${CG.IDEAS.map((x,i)=>`<a href="#k${i}" data-anchor="k${i}">${esc(x[0])}</a>`).join("")}</div>
  ${CG.IDEAS.map((x,i)=>`<div class="card" id="k${i}"><h3>${esc(x[0])}<small>${esc(x[1])}</small></h3><p>${esc(x[2])}</p><div class="refs">${x[3].map(refBtn).join("")}</div></div>`).join("")}</section>`;
}
function viewStories(){
  main.innerHTML=`<section class="page"><h2>名段</h2><p class="lede">书中最常被讲起的三十段，按条目顺序排列。</p><ul class="slist">${CG.STORIES.map(x=>`<li><button data-go="${x[1]}"><span class="rs">${x[1]}</span><span><b>${esc(x[0])}</b><span class="o">${esc(x[2])}</span></span></button></li>`).join("")}</ul></section>`;
}
function findN(qt){const k=han(qt);const e=IDX.find(x=>x.h.includes(k));return e?e.n:0}
function viewSayings(){
  const list=CG.SAYINGS.map(s=>[s,findN(s)]).sort((a,b)=>a[1]-b[1]);
  main.innerHTML=`<section class="page"><h2>名句</h2><p class="lede">${list.length} 句，按条目顺序排列，点一句跳到原文。</p><ul class="slist say">${list.map(([s,n])=>`<li><button data-go="${n}"><span class="q">${esc(s)}</span><span class="rs">${n||""}</span></button></li>`).join("")}</ul></section>`;
}
function viewHow(){main.innerHTML=`<section class="page"><h2>怎么读</h2>${CG.HOWTO.map(x=>`<h3>${esc(x[0])}</h3><p class="lede">${esc(x[1])}</p>`).join("")}</section>`}

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/"),t=p[0]||"r";
  document.querySelectorAll("#tabs a").forEach(a=>a.removeAttribute("aria-current"));
  const cur=document.querySelector(`#tabs a[data-t="${t==="n"?"r":t}"]`);if(cur)cur.setAttribute("aria-current","page");
  if(t==="n"){const n=+p[1];const i=BYN[n];return viewRead(i===undefined?0:i,n)}
  if(t==="guide")viewGuide();else if(t==="ideas")viewIdeas();else if(t==="stories")viewStories();else if(t==="sayings")viewSayings();else if(t==="how")viewHow();
  else return viewRead(p[1]!==undefined&&p[1]!==""?+p[1]:+(store.get("cxl-sec")||0));
  window.scrollTo(0,0);
}
const go=n=>{const h="#/n/"+n;if(location.hash===h)route();else location.hash=h};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){qres.hidden=true;go(g.dataset.go);return}
  const s=e.target.closest("[data-sec]");if(s){location.hash="#/r/"+s.dataset.sec;return}
  const a=e.target.closest("[data-anchor]");if(a){e.preventDefault();document.getElementById(a.dataset.anchor).scrollIntoView({block:"start"})}
});
window.addEventListener("hashchange",route);

function hl(t,s){const i=t.indexOf(s);if(i<0)return esc(t.slice(0,46))+"…";const a=Math.max(0,i-14);return (a?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(s)+"</mark>"+esc(t.slice(i+s.length,i+s.length+34))+"…"}
q.addEventListener("input",()=>{
  const s=q.value.trim();if(!s){qres.hidden=true;return}
  if(/^\d{1,3}$/.test(s)&&BYN[+s]!==undefined){qres.hidden=false;const it=SECS[BYN[+s]].items.find(x=>x.n===+s);qres.innerHTML=`<button data-go="${+s}"><span class="rs">${+s}</span><span class="rt">${esc(it.t.replace(/〔\d+〕/g,"").slice(0,50))}…</span></button>`;return}
  const hs=han(s),out=[];
  for(const x of IDX){if(hs&&x.h.includes(hs))out.push([x.n,hl(x.t,s)]);else if(x.v.includes(s))out.push([x.n,hl(x.v,s)]);if(out.length>=80)break}
  qres.hidden=false;
  qres.innerHTML=out.length?`<p>${out.length>=80?"前 80 条":out.length+" 条"}</p>`+out.map(([n,t])=>`<button data-go="${n}"><span class="rs">${n}</span><span class="rt">${t}</span></button>`).join(""):`<p>没有找到，换个词试试。</p>`;
});

fetch("cxl/data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  d.forEach(v=>v.secs.forEach(s=>{s.v=v.v;SECS.push(s)}));
  SECS.forEach((s,i)=>s.items.forEach(it=>{BYN[it.n]=i;const t=it.t.replace(/〔\d+〕/g,""),bh=CB[it.n]||[];IDX.push({n:it.n,t,h:han(t),v:(bh[0]||"")+(bh[1]||"")+(CJ[it.n]?CJ[it.n].join(""):"")})}));
  route();
}).catch(()=>{main.innerHTML="<p>原文没有取到，请刷新再试。</p>"});
</script>
</body>
